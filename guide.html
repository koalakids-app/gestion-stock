<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Guide pour les parents</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/guide-render.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#FDF8F2;padding:18px 16px 60px}
.bar{max-width:760px;margin:0 auto 14px;display:flex;justify-content:flex-end}
.bar button{border:none;background:#EEECFA;color:#4A3F9F;font:700 13px 'Nunito',sans-serif;padding:9px 14px;border-radius:12px;cursor:pointer}
.msg{max-width:520px;margin:80px auto;text-align:center;font:600 16px 'Nunito',sans-serif;color:#8E8AA8}
@media print{body{background:#fff;padding:0}.bar{display:none}}
</style>
<style id="gcss"></style>
</head>
<body>
<div class="bar"><button onclick="window.print()">Imprimer / enregistrer en PDF</button></div>
<div id="root" class="g-doc"><div class="msg">Chargement…</div></div>
<script>
const SUPABASE_URL="https://juyrceadazrovlitxceb.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1eXJjZWFkYXpyb3ZsaXR4Y2ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MjcyMDIsImV4cCI6MjA5NTQwMzIwMn0.yTEoRjhJFm3qj5oY2tLIcCXOWHHbU3rxWoIn47QKmug";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
document.getElementById('gcss').textContent=KKGuide.css;
(async function(){
  const root=document.getElementById('root');
  const id=new URLSearchParams(location.search).get('id');
  const fail=t=>{root.innerHTML='<div class="msg">'+t+'</div>';document.querySelector('.bar').style.display='none';};
  if(!id||!/^[0-9a-f-]{36}$/i.test(id))return fail('Lien invalide.');
  const{data,error}=await sb.rpc('kk_guide_public',{p_id:id});
  if(error)return fail('Ce guide est momentanément indisponible.');
  if(!data)return fail('Ce guide n’est pas (ou plus) disponible.');
  document.title=(data.guide.titre||'Guide pour les parents');
  root.innerHTML=KKGuide.render(data.guide,data.blocs);
})();
</script>
</body>
</html>
