<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Signature</title>
<!-- Police chargée sans bloquer l'affichage : si le réseau la bloque, la page s'affiche quand même. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
:root{--violet:#4A3F9F;--orange:#F47920;--cream:#FDF8F2;--muted:#8E8AA8;--line:#EFE9F5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--cream);color:#2B2740;
     min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:460px;
      box-shadow:0 4px 24px rgba(43,39,64,.10)}
h1{font-size:18px;color:var(--violet);margin-bottom:4px}
.ctx{font-size:13px;color:var(--muted);margin-bottom:18px}
.who{font-size:14px;font-weight:700;margin-bottom:10px}
canvas{width:100%;height:200px;border:1px dashed var(--line);border-radius:14px;
       background:#fff;touch-action:none;display:block}
.tip{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.acts{display:flex;gap:10px;margin-top:16px}
button{flex:1;border:none;border-radius:12px;padding:14px;font-family:'Nunito';
       font-weight:800;font-size:15px;cursor:pointer}
.p{background:var(--orange);color:#fff}
.g{background:#F1EFF7;color:var(--muted)}
button:disabled{opacity:.5}
.state{text-align:center;padding:30px 10px}
.state i{font-size:44px;display:block;margin-bottom:12px}
.ok{color:#2E7D32}.err{color:#C62828}
.state h2{font-size:17px;margin-bottom:6px}
.state p{font-size:13.5px;color:var(--muted)}
.docbox{border:1px solid var(--line);border-radius:14px;padding:12px 14px;max-height:42vh;overflow-y:auto;
        font-size:13px;line-height:1.5;margin-bottom:10px;background:#fff}
.docbox h1,.docbox h2,.docbox h3{font-size:14px;color:var(--violet);margin:10px 0 4px}
.docbox table{border-collapse:collapse;width:100%;margin:6px 0}
.docbox td,.docbox th{border:1px solid var(--line);padding:3px 6px;font-size:12px;vertical-align:top}
.docbox img{max-width:100%}
.dl{display:inline-block;font-size:12.5px;font-weight:700;color:var(--violet);margin-bottom:12px}
.lu{display:flex;gap:8px;align-items:flex-start;font-size:13px;font-weight:700;margin:4px 0 14px}
.lu input{margin-top:3px;width:18px;height:18px;flex:none}
</style>
</head>
<body>
<div class="card" id="card"><div class="state"><p>Chargement…</p></div></div>

<script src="js/pages/signature.js"></script>
</body>
</html>
