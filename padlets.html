<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koala Kids — Padlets</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Instrument Sans', sans-serif;
  background: #F0EDE8;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 24px;
}

.container {
  width: 100%;
  max-width: 820px;
  padding-top: 8px;
  padding-bottom: 32px;
}

.back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-decoration: none;
  color: #A8A29E;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 24px;
}
.back:hover { color: #78716C; }

.logo {
  text-align: center;
  margin-bottom: 32px;
}
.logo h1 {
  font-family: 'Syne', sans-serif;
  font-size: 28px;
  font-weight: 800;
  color: #1C1917;
  letter-spacing: -0.5px;
}
.logo h1 span { color: #E4407F; }
.logo p {
  font-size: 13px;
  color: #A8A29E;
  margin-top: 6px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  font-weight: 500;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.card {
  background: #fff;
  border-radius: 16px;
  padding: 24px 18px;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 14px;
  aspect-ratio: 1 / 1;
  transition: transform .12s ease, box-shadow .12s ease;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,.06);
}

.card-icon {
  width: 60px;
  height: 60px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  flex-shrink: 0;
  background: #FCE7F0;
}

.card-text h2 {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: #1C1917;
  line-height: 1.3;
}

.card-arrow {
  display: none;
}
.card:hover .card-arrow { color: #E4407F; }

.state {
  background: #fff;
  border-radius: 16px;
  padding: 32px 24px;
  text-align: center;
  color: #78716C;
  font-size: 14px;
  line-height: 1.6;
}
.state strong {
  display: block;
  font-family: 'Syne', sans-serif;
  font-size: 16px;
  color: #1C1917;
  margin-bottom: 8px;
}
.state a {
  display: inline-block;
  margin-top: 16px;
  background: #E4407F;
  color: #fff;
  text-decoration: none;
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
}

.footer {
  text-align: center;
  margin-top: 28px;
  font-size: 11.5px;
  color: #C8C4BE;
}

@media (max-width: 720px) {
  .container { max-width: 480px; }
  .cards { grid-template-columns: repeat(2, 1fr); gap: 14px; }
}

@media (max-width: 400px) {
  .cards { gap: 12px; }
  .card { padding: 18px 12px; gap: 10px; }
  .card-icon { width: 52px; height: 52px; font-size: 24px; }
  .card-text h2 { font-size: 13px; }
}
</style>
</head>
<body>

<div class="container">

  <a href="index.html" class="back">‹ Retour à l'accueil</a>

  <div class="logo">
    <h1>Padlets<span>.</span></h1>
    <p>Ressources partagées</p>
  </div>

  <div id="zone"><div class="state">Chargement…</div></div>

  <div class="footer">Koala Kids © 2026</div>

</div>

<script>
const SUPABASE_URL="https://juyrceadazrovlitxceb.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1eXJjZWFkYXpyb3ZsaXR4Y2ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MjcyMDIsImV4cCI6MjA5NTQwMzIwMn0.yTEoRjhJFm3qj5oY2tLIcCXOWHHbU3rxWoIn47QKmug";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function showState(titre,texte,lien){
  document.getElementById('zone').innerHTML=
    '<div class="state"><strong>'+esc(titre)+'</strong>'+esc(texte)+
    (lien?'<br><a href="'+lien+'">Se connecter</a>':'')+'</div>';
}

function render(list){
  if(!list.length){
    showState('Aucun padlet disponible','Aucune ressource ne vous est accessible pour le moment.');
    return;
  }
  document.getElementById('zone').innerHTML='<div class="cards">'+list.map(p=>
    '<a href="'+esc(p.url)+'" target="_blank" rel="noopener" class="card">'+
      '<div class="card-icon">'+esc(p.icone||'📌')+'</div>'+
      '<div class="card-text"><h2>'+esc(p.titre)+'</h2></div>'+
      '<div class="card-arrow">›</div>'+
    '</a>').join('')+'</div>';
}

window.addEventListener('DOMContentLoaded',async function(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){
    showState('Connexion requise','Connectez-vous à l\'application pour accéder aux padlets.','demandes.html');
    return;
  }
  const {data,error}=await sb.from('padlets')
    .select('titre,icone,url,ordre')
    .order('ordre',{ascending:true});
  if(error){
    console.error('[padlets]',error);
    showState('Erreur de chargement','Impossible de récupérer la liste des padlets.');
    return;
  }
  render(data||[]);
});
</script>

</body>
</html>
