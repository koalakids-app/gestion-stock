<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>html,body{overscroll-behavior-y:contain}</style>
<meta name="robots" content="noindex">
<title>Contrôle - Registre de sécurité</title>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
:root{--violet:#4A3F9F;--orange:#F47920;--cream:#FDF8F2;--muted:#8E8AA8;--line:#EFE9F5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--cream);color:#2B2740;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:16px}
.card{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:480px;box-shadow:0 4px 24px rgba(43,39,64,.10)}
h1{font-size:18px;color:var(--violet);margin-bottom:4px}
.ctx{font-size:13px;color:var(--muted);margin-bottom:16px}
.f{margin-bottom:12px}
label{display:block;font-size:12.5px;font-weight:800;margin-bottom:4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-family:inherit;font-size:16px;background:#fff}
textarea{min-height:80px;resize:vertical}
canvas{width:100%;height:150px;border:1px dashed var(--line);border-radius:14px;touch-action:none;display:block;background:#fff}
.tip{font-size:12px;color:var(--muted);margin-top:6px}
.acts{display:flex;gap:10px;margin-top:16px}
button{flex:1;border:none;border-radius:12px;padding:14px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.p{background:var(--orange);color:#fff}.g{background:#F1EFF7;color:var(--muted)}
button:disabled{opacity:.5}
.state{text-align:center;padding:30px 10px}
.state h2{font-size:17px;margin-bottom:6px}.state p{font-size:13.5px;color:var(--muted)}
.ok h2{color:#2E7D32}.err h2{color:#C62828}
</style>
</head>
<body>
<div class="card" id="card"><div class="state"><p>Chargement…</p></div></div>
<script src="js/pages/registre-visiteur.js"></script>
</body>
</html>
