<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suivi de l'enfant — Koala Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --violet:#3D3580; --violet-l:#8E8AA8; --violet-bg:#EEEDF8;
  --orange:#F47920; --green:#1B7A3E; --green-bg:#E8F5EC;
  --red:#C62828; --red-bg:#FDECEC;
  --ink:#2B2740; --muted:#78748C; --line:#E3E1EF; --bg:#F7F6FC;
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.55}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0}
.top{background:var(--violet);color:#fff;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.top h1{font-size:20px;display:flex;align-items:center;gap:8px}
.top p{margin:5px 0 0;font-size:13.5px;opacity:.86}
.wrap{max-width:640px;margin:0 auto;padding:18px 14px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 17px;margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-head .periode{font-family:'Baloo 2',system-ui,sans-serif;color:var(--violet);font-size:15.5px}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.badge.jour{background:var(--violet-bg);color:var(--violet)}
.badge.semaine{background:#E7F1FB;color:#1D5A96}
.badge.mois{background:var(--green-bg);color:var(--green)}
.badge.annee{background:#FDF0E3;color:#B25F00}
.bullets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.bullets li{font-size:14px;padding-left:18px;position:relative}
.bullets li::before{content:'';position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--orange)}
.note-ref{background:var(--violet-bg);border-radius:10px;padding:11px 13px;margin-top:12px;font-size:13.5px;color:var(--violet);white-space:pre-wrap}
.mention{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5}
.state{max-width:420px;margin:60px auto;text-align:center;padding:0 20px}
.state i{font-size:44px;color:var(--violet-l)}
.state h2{font-size:18px;margin:14px 0 6px}
.state p{color:var(--muted);font-size:13.5px}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:13.5px}
</style>
</head>
<body>

<div class="top">
  <h1><i class="ti ti-heart-handshake"></i> Suivi de l'enfant</h1>
  <p id="sousTitre">Chargement…</p>
</div>

<div class="wrap" id="wrap">
  <div class="state"><i class="ti ti-loader-2"></i><h2>Chargement…</h2></div>
</div>

<script>
/* ===========================================================================
   FAMILLE-SUIVI.HTML — page publique de consultation des synthèses
   ---------------------------------------------------------------------------
   Aucune session Supabase ici : la famille n'a pas de compte. Tout passe par
   l'edge function `suivi-famille`, qui s'exécute en service_role et ne
   renvoie que le contenu "famille" des synthèses publiées de l'enfant
   correspondant au jeton de l'URL — jamais le contenu interne. Aucune table
   n'est interrogée directement, aucune policy anon sur les tables suivi_*.
   =========================================================================== */

const SUPABASE_URL = "https://juyrceadazrovlitxceb.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1eXJjZWFkYXpyb3ZsaXR4Y2ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MjcyMDIsImV4cCI6MjA5NTQwMzIwMn0.yTEoRjhJFm3qj5oY2tLIcCXOWHHbU3rxWoIn47QKmug";
const FN_URL = SUPABASE_URL + '/functions/v1/suivi-famille';

const TOKEN = new URLSearchParams(location.search).get('t') || '';
const wrap  = document.getElementById('wrap');

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function etat(titre,msg,icone){
  wrap.innerHTML='<div class="state"><i class="ti ti-'+(icone||'alert-circle')+'"></i>'
    +'<h2>'+esc(titre)+'</h2><p>'+esc(msg)+'</p></div>';
}

async function appel(action,payload){
  const r=await fetch(FN_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,
             'Authorization':'Bearer '+SUPABASE_ANON_KEY},
    body:JSON.stringify(Object.assign({action,token:TOKEN},payload||{}))
  });
  let j=null;
  try{j=await r.json();}catch(e){}
  if(!r.ok||!j||j.erreur)throw new Error((j&&j.erreur)||('Erreur '+r.status));
  return j;
}

const PERIODE_LABEL={jour:'Jour',semaine:'Semaine',mois:'Mois',annee:'Année'};
function libellePeriode(s){
  const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  if(s.periode_type==='jour')return new Date(s.periode_debut+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  if(s.periode_type==='semaine')return 'Semaine du '+fmt(s.periode_debut)+' au '+fmt(s.periode_fin);
  if(s.periode_type==='mois')return new Date(s.periode_debut+'T12:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  return 'Année '+s.periode_debut.slice(0,4)+'-'+s.periode_fin.slice(0,4);
}

async function boot(){
  if(!TOKEN)return etat('Lien incomplet','Ce lien ne contient pas de jeton. Utilisez celui reçu par la crèche.','link-off');
  try{
    const d=await appel('get');
    document.getElementById('sousTitre').textContent=
      (d.enfant.prenom||'')+(d.creche_nom?' · '+d.creche_nom:'');
    renderListe(d.syntheses||[]);
  }catch(e){
    const m=(e.message||'').toLowerCase();
    if(m.includes('revoque'))
      etat('Lien désactivé','Cet accès n\'est plus valable. Contactez la crèche pour en obtenir un nouveau.','link-off');
    else if(m.includes('introuvable'))
      etat('Lien invalide','Ce lien ne correspond à aucun accès. Vérifiez que vous l\'avez copié en entier.','link-off');
    else
      etat('Erreur','Le suivi n\'a pas pu être chargé. Réessayez dans un instant.','alert-triangle');
  }
}

function renderListe(syntheses){
  if(!syntheses.length){
    wrap.innerHTML='<div class="empty"><i class="ti ti-mood-kid" style="font-size:32px"></i><br>Aucune synthèse publiée pour le moment.<br>Elle apparaîtra ici après le départ de votre enfant.</div>';
    return;
  }
  wrap.innerHTML=syntheses.map(s=>`
    <div class="card">
      <div class="card-head">
        <span class="periode">${esc(libellePeriode(s))}</span>
        <span class="badge ${esc(s.periode_type)}">${esc(PERIODE_LABEL[s.periode_type]||s.periode_type)}</span>
      </div>
      ${s.famille.length?`<ul class="bullets">${s.famille.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'<p style="color:var(--muted);font-size:13.5px">Rien à signaler de particulier.</p>'}
      ${s.note_referente?`<div class="note-ref">${esc(s.note_referente)}</div>`:''}
      ${(s.periode_type==='mois'||s.periode_type==='annee')?`<div class="mention">Repères élaborés par l'équipe Koala Kids, inspirés des travaux de Francine Ferland.</div>`:''}
    </div>`).join('');
}

boot();
</script>
</body>
</html>
