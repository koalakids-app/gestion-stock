<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suivi de l'enfant — Koala Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --violet:#3D3580; --violet-l:#8E8AA8; --violet-bg:#EEEDF8;
  --orange:#F47920; --green:#1B7A3E; --green-bg:#E8F5EC;
  --red:#C62828; --red-bg:#FDECEC;
  --ink:#2B2740; --muted:#78748C; --line:#E3E1EF; --bg:#F7F6FC;
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.55}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0}
.top{background:var(--violet);color:#fff;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.top h1{font-size:20px;display:flex;align-items:center;gap:8px}
.top p{margin:5px 0 0;font-size:13.5px;opacity:.86}
.wrap{max-width:640px;margin:0 auto;padding:18px 14px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 17px;margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-head .periode{font-family:'Baloo 2',system-ui,sans-serif;color:var(--violet);font-size:15.5px}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap}
.badge.jour{background:var(--violet-bg);color:var(--violet)}
.badge.semaine{background:#E7F1FB;color:#1D5A96}
.badge.mois{background:var(--green-bg);color:var(--green)}
.badge.annee{background:#FDF0E3;color:#B25F00}
.bullets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.bullets li{font-size:14px;padding-left:18px;position:relative}
.bullets li::before{content:'';position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--orange)}
.note-ref{background:var(--violet-bg);border-radius:10px;padding:11px 13px;margin-top:12px;font-size:13.5px;color:var(--violet);white-space:pre-wrap}
.mention{font-size:11.5px;color:var(--muted);margin-top:14px;line-height:1.5}
.btn{font:inherit;font-weight:700;font-size:13px;border:none;border-radius:10px;padding:9px 14px;
  cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-g{background:var(--violet-bg);color:var(--violet)}
.card-acts{margin-top:14px}
.state{max-width:420px;margin:60px auto;text-align:center;padding:0 20px}
.state i{font-size:44px;color:var(--violet-l)}
.state h2{font-size:18px;margin:14px 0 6px}
.state p{color:var(--muted);font-size:13.5px}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:13.5px}
</style>
</head>
<body>

<div class="top">
  <h1><i class="ti ti-heart-handshake"></i> Suivi de l'enfant</h1>
  <p id="sousTitre">Chargement…</p>
</div>

<div class="wrap" id="wrap">
  <div class="state"><i class="ti ti-loader-2"></i><h2>Chargement…</h2></div>
</div>

<script src="js/session-lien.js"></script>
<script src="js/pages/famille-suivi.js"></script>
</body>
</html>
