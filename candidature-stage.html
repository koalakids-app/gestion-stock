<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>html,body{overscroll-behavior-y:contain}</style>
<title>Demande de stage — Koala Kids</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/pages/stagiaire.css">
<style>
.f{margin-bottom:12px}
.lb{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.lb i{color:var(--red);font-style:normal}
input,select,textarea{width:100%;font:inherit;font-size:15px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--violet)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.g2{grid-template-columns:1fr}}
.pot{position:absolute;left:-9999px;height:0;overflow:hidden}
.msg{border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;background:var(--red-bg);color:var(--red)}
.cases{display:flex;gap:8px;margin-bottom:12px}
.cases label{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-weight:700;cursor:pointer;background:#fff}
.cases input{display:none}
.cases input:checked+span{color:var(--violet)}
.cases label:has(input:checked){border-color:var(--violet);background:var(--violet-bg)}
.accord{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--muted);margin:6px 0 14px}
.accord input{width:auto;margin-top:3px}
.pied{font-size:12px;color:var(--muted);text-align:center;margin-top:22px}
</style>
</head>
<body>
<div class="top">
  <h1>Demande de stage ou d'alternance</h1>
  <p id="sousTitre">Koala Kids</p>
</div>
<div class="wrap" id="wrap">
  <div class="state"><h2>Chargement…</h2><p>Un instant.</p></div>
</div>
<script src="js/pages/candidature-stage.js"></script>
</body>
</html>
