<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>html,body{overscroll-behavior-y:contain}</style>
<title>Pointage</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pages/tablette.css">
<meta name="theme-color" content="#E8620C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pointage">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>
/* Installable comme application : le manifeste est construit ici pour que
   start_url garde le jeton ?k= du lien (un manifeste statique le perdrait). */
(function(){
  try{
    var base=new URL('.',location.href).href;
    var m={name:'Koala Kids — Pointage',short_name:'Pointage',
      description:'Pointage des arrivées et départs',
      start_url:location.href,scope:base,id:location.href,
      display:'fullscreen',orientation:'any',lang:'fr',
      background_color:'#FFFFFF',theme_color:'#E8620C',
      icons:[{src:base+'icon-192.png',sizes:'192x192',type:'image/png',purpose:'any'},
             {src:base+'icon-512.png',sizes:'512x512',type:'image/png',purpose:'any'}]};
    var l=document.createElement('link');l.rel='manifest';
    l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
    document.head.appendChild(l);
  }catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</head>
<body>

<div class="top">
  <span class="title"><i>⏱</i> Pointage</span>
  <div class="clock"><div id="clock">--:--:--</div><div id="date"></div></div>
</div>

<div class="main" id="main">
  <div class="mode-switch" id="modeSwitch">
    <button class="on" data-mode="enfant" onclick="setMode('enfant')">Enfant</button>
    <button data-mode="perso" onclick="setMode('perso')">Personnel</button>
  </div>

  <div id="modeEnfant">
    <div class="prompt-group">
      <div class="prompt">Choisis tes 4 images</div>
      <div class="subprompt">dans l'ordre</div>
    </div>
    <div class="picto-slots" id="pictoSlots"></div>
    <div class="picto-grid" id="pictoGrid"></div>
    <button class="picto-reset" onclick="resetPictos()">↺ Recommencer</button>
  </div>

  <div id="modePerso" class="hidden">
    <div class="prompt-group">
      <div class="prompt">Choisissez vos 4 images</div>
      <div class="subprompt">dans l'ordre</div>
    </div>
    <div class="picto-slots" id="pictoSlotsPerso"></div>
    <div class="picto-grid" id="pictoGridPerso"></div>
    <button class="picto-reset" onclick="resetPictosPerso()">↺ Recommencer</button>
  </div>
</div>

<div class="state hidden" id="stateBox"></div>

<script src="js/pages/tablette.js"></script>
</body>
</html>
