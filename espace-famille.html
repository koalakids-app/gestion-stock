<style>
:root{
  --violet:#3D3580; --violet-l:#8E8AA8; --violet-bg:#EEEDF8;
  --orange:#F47920; --green:#1B7A3E; --green-bg:#E8F5EC;
  --red:#C62828; --red-bg:#FDECEC;
  --ink:#2B2740; --muted:#78748C; --line:#E3E1EF; --bg:#F7F6FC;
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.55}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0}
.top{background:var(--violet);color:#fff;padding:20px 18px}
.top h1{font-size:20px;display:flex;align-items:center;gap:8px}
.top p{margin:5px 0 0;font-size:13.5px;opacity:.86}
.wrap{max-width:640px;margin:0 auto;padding:18px 14px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 17px;margin-bottom:14px}
.card h2{font-size:16px;color:var(--violet);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.msg{border-top:1px solid var(--line);padding:12px 0}
.msg:first-of-type{border-top:0;padding-top:0}
.msg h3{font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg .date{font-size:12px;color:var(--muted)}
.msg p{margin:6px 0 0;white-space:pre-wrap;font-size:14px}
.nouveau{background:var(--orange);color:#fff;border-radius:99px;padding:1px 9px;font-size:11px;font-weight:700}
.btn{font:inherit;font-weight:700;font-size:14px;border:none;border-radius:10px;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:var(--violet);color:#fff;text-decoration:none}
.btn[disabled]{opacity:.55}
.btn-g{background:var(--violet-bg);color:var(--violet)}
input[type=text],input[type=email]{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff}
.code{letter-spacing:.25em;text-transform:uppercase;text-align:center;font-weight:700;font-size:20px}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 5px}
.state{max-width:420px;margin:60px auto;text-align:center;padding:0 20px}
.state i{font-size:44px;color:var(--violet-l)}
.state h2{font-size:18px;margin:14px 0 6px}
.state p{color:var(--muted);font-size:13.5px}
.vide{color:var(--muted);font-size:13.5px}
.dep{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.dep:first-of-type{border-top:0}
.pictos{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.picto{position:relative;width:calc(25% - 8px);min-width:68px;text-align:center;background:var(--violet-bg);border-radius:14px;padding:16px 4px 8px}
.picto img{display:block;margin:0 auto;max-width:100%;height:auto}
.picto small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.picto .rang{position:absolute;top:-8px;left:-6px;background:var(--orange);color:#fff;border-radius:50%;width:24px;height:24px;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.reglement{margin-top:12px;font-size:13.5px;line-height:1.6}
.reglement ul{margin:6px 0 8px 18px;padding:0}
.reglement table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12.5px}
.reglement th,.reglement td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.reglement th{background:var(--violet-bg);color:var(--violet)}
summary::-webkit-details-marker{display:none}
.appareil p{margin:6px 0;font-size:13.5px}
.appareil ol{margin:6px 0 8px 18px;padding:0;font-size:13.5px}
.appareil .ok{color:var(--green);font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center}
.appareil .lien{background:none;border:0;padding:0;font:inherit;font-size:12.5px;color:var(--muted);text-decoration:underline;cursor:pointer}
.souvenir{display:flex;gap:8px;align-items:flex-start;font-weight:600;font-size:13px;margin:12px 0 0}
.souvenir input{margin-top:3px;width:auto}
.onglets{position:sticky;top:0;z-index:20;display:flex;gap:4px;background:var(--bg);padding:8px 0 10px;margin:-6px 0 8px;border-bottom:1px solid var(--line)}
.onglet{flex:1;position:relative;font:inherit;font-size:11.5px;font-weight:700;border:none;background:#fff;color:var(--muted);border-radius:12px;padding:8px 2px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line)}
.onglet i{font-size:20px}
.onglet.actif{background:var(--violet);color:#fff;border-color:var(--violet)}
.acc-a-signer{border-color:var(--orange);border-width:2px}
.acc-texte{font-size:13.5px;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:var(--bg)}
.acc-choix{border:1px solid var(--line);border-radius:10px;padding:8px 12px 10px;margin:0 0 12px}
.acc-choix legend{font-size:13px;font-weight:700;color:var(--violet);padding:0 6px}
.acc-radio{display:flex;gap:9px;align-items:flex-start;font-size:14px;margin:6px 0;font-weight:400;cursor:pointer}
.acc-radio input{margin-top:4px;flex:none}
.ok-acc{margin-top:10px;background:var(--green-bg);color:var(--green);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13.5px}
.err{background:var(--red-bg);color:var(--red);border-radius:10px;padding:8px 12px;font-size:13.5px}
.pastille{position:absolute;top:3px;right:6px;background:var(--orange);color:#fff;border-radius:99px;font-style:normal;font-size:10.5px;min-width:17px;padding:1px 5px;line-height:1.3}
.une{border-left:4px solid var(--orange)}
.une-t{font-size:17px;margin:2px 0}
.une-p{margin:8px 0 12px;font-size:14px;white-space:pre-wrap}
.date{font-size:12px;color:var(--muted)}
.msg-d{border-top:1px solid var(--line);padding:2px 0}
.msg-d:first-of-type{border-top:0}
.msg-d summary{cursor:pointer;list-style:none;padding:11px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.msg-d summary::-webkit-details-marker{display:none}
.msg-d summary::after{content:'\203A';font-size:20px;color:var(--violet-l);transition:transform .15s}
.msg-d[open] summary::after{transform:rotate(90deg)}
.msg-t{flex:1}
.msg-d summary .date{font-weight:400;white-space:nowrap}
.msg-d p{margin:0 0 8px;white-space:pre-wrap;font-size:14px}
.dep .btn{white-space:nowrap}
.tuiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tuile{font:inherit;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.tuile i{font-size:26px;color:var(--violet)}
.tuile small{color:var(--muted);font-size:12px}
.ctc{padding:10px 0;border-top:1px solid var(--line)}
.ctc:first-of-type{border-top:0;padding-top:0}
.ctc .role{background:var(--violet-bg);color:var(--violet);border-radius:99px;padding:1px 9px;font-size:11px;font-weight:700;margin-left:4px;white-space:nowrap}
.ctc-btn{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.err{color:var(--red);font-size:13px;margin-top:8px}
.ok{color:var(--green);font-size:13px;margin-top:8px}
</style>
</head>
<body>

<div class="top">
  <h1><i class="ti ti-home-heart"></i> Espace famille</h1>
  <p id="sousTitre">Koala Kids</p>
</div>

<div class="wrap" id="wrap">
  <div class="state"><i class="ti ti-loader-2"></i><h2>Chargement…</h2></div>
</div>

<p style="text-align:center;font-size:12px;margin:18px 16px"><a href="confidentialite.html" style="color:inherit">Politique de confidentialité</a></p>

<script src="js/pages/espace-famille.js?v=7"></script>
</body>
</html>
