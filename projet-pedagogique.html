<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>html,body{overscroll-behavior-y:contain}</style>
<title>Koala Kids — Projet pédagogique</title>
<meta name="description" content="Le projet pédagogique des crèches Koala Kids, à lire ou à télécharger.">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pages/menu.css">
<style>
.carte{background:#fff;border:2px solid var(--line);border-radius:16px;padding:20px 18px;text-align:center}
.carte .big{font-size:44px;margin-bottom:4px}
.carte h2{font-family:'Baloo 2',cursive;color:var(--violet);font-size:19px}
.carte p{color:var(--muted);font-size:14px;margin:4px 0 16px}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btns a{font-family:inherit;font-size:15px;font-weight:800;text-decoration:none;padding:12px 20px;border-radius:12px;
  border:2px solid var(--violet);color:var(--violet);background:#fff}
.btns a.p{background:var(--orange);border-color:var(--orange);color:#fff}
.apercu{display:none;margin-top:14px;width:100%;height:78vh;border:2px solid var(--line);border-radius:12px;background:#fff}
@media(min-width:760px){.apercu{display:block}.wrap{max-width:980px}.hd-in{max-width:980px}}
</style>
</head>
<body>

<div class="hd"><div class="hd-in">
  <img class="logo" src="logo-koalakids.png" alt="Koala Kids">
  <h1>Projet pédagogique</h1>
  <div class="s">Crèches Koala Kids</div>
</div></div>

<div class="wrap">
  <div class="carte">
    <div class="big">📖</div>
    <h2>Projet pédagogique Koala Kids</h2>
    <p>Document PDF — 133 pages. Vous pouvez le lire en ligne ou l'enregistrer.</p>
    <div class="btns">
      <a class="p" href="projet-pedagogique-koalakids.pdf" target="_blank" rel="noopener">📖 Lire le document</a>
      <a href="projet-pedagogique-koalakids.pdf" download="Projet pédagogique Koala Kids.pdf">⬇️ Télécharger</a>
    </div>
  </div>
  <iframe class="apercu" src="projet-pedagogique-koalakids.pdf" title="Projet pédagogique Koala Kids"></iframe>
</div>

</body>
</html>
