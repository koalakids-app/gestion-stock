<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>html,body{overscroll-behavior-y:contain}</style>
<title>Koala Kids — Projet pédagogique</title>
<meta name="description" content="Le projet pédagogique des crèches Koala Kids, à feuilleter comme un livre ou à télécharger.">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/pages/projet-pedagogique.css">
</head>
<body>

<div class="hd"><div class="hd-in">
  <div class="tit">
    <img class="logo" src="logo-koalakids.png" alt="Koala Kids">
    <h1 id="titre">Projet pédagogique</h1>
  </div>
  <div class="acts">
    <button class="bt" id="btnRecherche" type="button" hidden>🔎 <span>Rechercher</span></button>
    <button class="bt" id="btnLoupe" type="button" hidden>🔍 <span>Agrandir</span></button>
    <a class="bt" id="btnTelecharger" href="projet-pedagogique-koalakids.pdf" target="_blank" rel="noopener">⬇️ <span>Télécharger</span></a>
    <button class="bt" id="btnPlein" type="button">⛶ <span>Plein écran</span></button>
  </div>
</div></div>

<main class="scene" id="scene">
  <div class="etat" id="etat"><div class="big">📖</div><p id="etatTxt">Ouverture du livre…</p></div>
  <button class="fl g" id="btnPrev" type="button" aria-label="Page précédente" hidden>‹</button>
  <div class="livre" id="livre"></div>
  <button class="fl d" id="btnNext" type="button" aria-label="Page suivante" hidden>›</button>
</main>

<div class="barre" id="barre" hidden>
  <input type="range" id="curseur" min="1" value="1" aria-label="Aller à la page">
  <div class="pg"><span id="pgTxt">1</span></div>
</div>

<div class="rech" id="rech" hidden>
  <div class="rech-bar">
    <input type="search" id="rechQ" placeholder="Chercher un mot (ex. sieste, attachement)…" autocomplete="off" enterkeyhint="search">
    <button type="button" id="rechFermer" aria-label="Fermer la recherche">✕</button>
  </div>
  <div class="rech-info" id="rechInfo"></div>
  <div class="rech-liste" id="rechListe"></div>
</div>

<div class="loupe" id="loupe" hidden>
  <div class="loupe-bar">
    <button type="button" id="lpPrev" aria-label="Page précédente">‹</button>
    <span id="lpTxt"></span>
    <button type="button" id="lpNext" aria-label="Page suivante">›</button>
    <span class="sp"></span>
    <button type="button" id="lpMoins" aria-label="Réduire">−</button>
    <button type="button" id="lpPlus" aria-label="Agrandir">+</button>
    <button type="button" id="lpFermer" aria-label="Fermer">✕</button>
  </div>
  <div class="loupe-zone" id="lpZone"><img id="lpImg" alt=""></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script src="js/pages/projet-pedagogique.js"></script>
</body>
</html>
