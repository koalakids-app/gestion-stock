name: Rappel des visites médicales à planifier (Odalia)

on:
  schedule:
    # Chaque lundi à 9h00 (hiver) / 10h00 (été) heure de Paris.
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Essai à blanc : liste les collaborateurs concernés, sans notifier"
        type: boolean
        default: true

jobs:
  rappel:
    runs-on: ubuntu-latest
    steps:
      - name: Prévenir des visites à planifier
        run: |
          dry='${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}'
          status=$(curl -s -o /tmp/reponse.json -w "%{http_code}" \
            -X POST "https://juyrceadazrovlitxceb.supabase.co/functions/v1/rappel-visites-medicales" \
            -H "x-relance-secret: ${{ secrets.RELANCE_TRIGGER_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"dry_run\": ${dry}}")
          echo "Réponse (HTTP $status) :"
          cat /tmp/reponse.json
          echo
          if [ "$status" -ne 200 ]; then
            echo "::error::Rappel des visites médicales en échec (HTTP $status)"
            exit 1
          fi
